type: github_release
repo_owner: AlexanderGrooff
repo_name: mermaid-ascii
description: Render Mermaid graphs inside your terminal
version_overrides:
  - version_constraint: "true"
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
  - version_constraint: semver("> 0.1.0")
    no_asset: true
  - version_constraint: semver("> 0.0.2")
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
  - version_constraint: semver("<= 0.0.2")
    no_asset: true
