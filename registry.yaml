type: github_release
repo_owner: 1xyz
repo_name: pryrite
description: Pryrite, interactively execute shell code blocks in a markdown file
version_overrides:
    - version_constraint: semver("> 0.10.16")
      asset: pryrite-{{.OS}}-{{.Arch}}-{{.Version}}.{{.Format}}
      format: zip
      rosetta2: true
      supported_envs:
        - linux
        - darwin
    - version_constraint: semver("<= 0.10.16")
      no_asset: true
