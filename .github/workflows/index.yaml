---
name: index
# Keep index.json in step with the package branches.
#
# 'ar2 run' adds a package to the catalogue as it takes it over, which is the one
# moment a package can be new to it. This is the reconciliation: it looks at every
# branch and adds whatever the catalogue doesn't have, which is what catches a
# package whose run failed after committing its definition, or whose pull request
# was never merged. Nothing else would notice.
#
# It runs on demand here. It belongs on a schedule in the real registry, where nobody
# is watching for a package that quietly never arrived.
#
# Not a create event: GitHub reads the workflow from the ref that was created, and a
# package branch is an orphan carrying only the branch template. index.yaml lives on
# main and would never be there, so the event fires and nothing runs.
on:
  workflow_dispatch:
    inputs:
      ar2_ref:
        description: the ar2 ref to build
        required: false
        default: main
permissions: {}
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Committing the catalogue to the update branch.
      contents: write
      # Opening the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: szksh-lab-2/ar2
          ref: ${{ inputs.ar2_ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v5.5.0
        with:
          go-version-file: go.mod
      - run: |
          go run ./cmd/ar2 index \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
