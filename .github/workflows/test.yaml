---
# The CI of a package branch. A pull_request workflow is read from the branch the
# pull request targets, so this has to be on the package branch itself rather than
# on the default branch.
name: test
on: pull_request
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      # A placeholder for installing every generated registry.json with aqua and
      # running its test command. Until that exists, the files are at least
      # checked to be JSON.
      - run: |
          find versions -name registry.json -print0 \
            | xargs -0 -r -n1 python3 -m json.tool --sort-keys > /dev/null
